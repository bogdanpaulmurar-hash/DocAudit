[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docaudit"
version = "0.0.2"
description = "Verificator local de documentație exportată din OneNote"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
docaudit = "docaudit.__main__:main"

[tool.setuptools.packages.find]
include = ["docaudit*"]

[tool.setuptools.package-data]
docaudit = ["locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

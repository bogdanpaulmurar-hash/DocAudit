[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docaudit"
version = "0.1.5"
description = "Verificator local de documentație exportată din OneNote"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
semantic = ["sentence-transformers>=2.2"]
windows = ["pywin32>=306; sys_platform == 'win32'", "comtypes>=1.2; sys_platform == 'win32'"]
tray = ["pystray>=0.19", "Pillow>=10"]

[project.scripts]
docaudit = "docaudit.__main__:main"

[tool.setuptools.packages.find]
include = ["docaudit*"]

[tool.setuptools.package-data]
docaudit = ["locales/*.json", "ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

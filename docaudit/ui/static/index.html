<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="docaudit-token" content="__TOKEN__">
<title>DocAudit</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><img src="/icon.svg" alt="" width="24" height="24"><span>DocAudit</span></div>
    <nav id="tabs" aria-label="DocAudit"></nav>
    <div class="tools">
      <label class="ds"><span data-t="ui.dataset"></span><select id="dataset"></select></label>
      <div class="prefs">
        <select id="lang" aria-label="Language"></select>
        <button id="theme" class="ghost icon-theme" type="button" aria-label="Theme" title="Light / Dark"></button>
      </div>
    </div>
  </aside>
  <div class="content">
    <div id="banner" class="banner" hidden></div>
    <main id="view"></main>
  </div>
</div>
<div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
